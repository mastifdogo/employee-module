<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees</title>
<style>
	:root { --bg: #fff; --soft: #f5f7f9; --text: #1d232b; --muted: #5d6875; --border: #dde1e6; --accent: #1f6feb; --danger: #cf222e; --ok: #1a7f37; --warn: #9a6700; color-scheme: light; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #171b21; --soft: #1e242c; --text: #e3e7ec; --muted: #97a1ad; --border: #2c333c; --accent: #4c8dff; --danger: #ff7b72; --ok: #56d364; --warn: #e3b341; color-scheme: dark; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; padding: 1rem 1.25rem 3rem; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
	h1 { font-size: 1.4rem; margin: 0; }
	h2 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; }
	p { margin: 0.4rem 0; }
	.top { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between; }
	.tiles { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.9rem 0; }
	.tile { flex: 1 1 6.5rem; min-width: 0; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.7rem; }
	.head { display: flex; align-items: center; gap: 0.75rem; }
	.head button { padding: 0.25rem 0.8rem; }
	.tile b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
	.tile span, .muted, small { color: var(--muted); }
	small { font-size: 0.82rem; }
	nav { display: flex; gap: 0.15rem; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
	nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 0.45rem 0.7rem; white-space: nowrap; }
	nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
	.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; margin: 0.6rem 0; }
	label { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.8rem; color: var(--muted); flex: 1 1 8rem; min-width: 0; }
	label.check { flex-direction: row; align-items: center; gap: 0.4rem; font-size: 0.95rem; color: var(--text); flex: 0 0 auto; padding-bottom: 0.4rem; }
	input, select, textarea { width: 100%; padding: 0.4rem 0.55rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
	input[type="checkbox"] { width: auto; }
	input.num { text-align: right; min-width: 5.5rem; }
	button { padding: 0.4rem 0.8rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
	button.plain { background: transparent; color: var(--accent); border-color: var(--border); }
	button.danger { background: transparent; color: var(--danger); border-color: var(--border); }
	button.small { padding: 0.15rem 0.5rem; font-size: 0.85rem; }
	button:disabled { opacity: 0.55; cursor: default; }
	.scroll { overflow-x: auto; }
	table { width: 100%; border-collapse: collapse; }
	th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
	th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); white-space: nowrap; }
	td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
	tfoot td { font-weight: 600; border-bottom: 0; }
	.chip { display: inline-block; padding: 0 0.45rem; border: 1px solid var(--border); border-radius: 999px; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
	.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--danger); }
	.card { border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 0.9rem; margin: 0.75rem 0; }
	.card > h3 { margin: 0 0 0.3rem; font-size: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: space-between; align-items: center; }
	.note { background: var(--soft); border-radius: 6px; padding: 0.55rem 0.75rem; margin: 0.6rem 0; }
	#msg { position: sticky; top: 0; z-index: 2; }
	#msg div { padding: 0.5rem 0.75rem; border-radius: 6px; margin-bottom: 0.6rem; background: var(--soft); border: 1px solid var(--border); }
	#msg .error { color: var(--danger); border-color: var(--danger); }
	dialog { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); padding: 1rem 1.1rem; width: min(34rem, calc(100vw - 1.5rem)); }
	dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
	dialog h2 { margin-top: 0; }
	dialog .row { align-items: start; }
	.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
	a { color: var(--accent); }
	.cal-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; justify-content: space-between; margin-bottom: 0.5rem; }
	.cal-head h2 { margin: 0; font-size: 1.2rem; }
	.cal-head label { flex: 0 1 12rem; }
	.cal-head .row { flex-wrap: nowrap; margin: 0; }
	.cal-head .row button { flex: 0 0 auto; }
	.cal-wrap { --rowh: 5.6rem; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
	.dow, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
	.dow { border-bottom: 1px solid var(--border); background: var(--soft); font-size: 0.72rem; text-transform: uppercase; color: var(--muted); }
	.dow span { padding: 0.25rem 0.4rem; overflow: hidden; }
	.cal { height: calc(6 * var(--rowh)); max-height: max(12rem, calc(100vh - 4rem)); overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y proximity; position: relative; }
	.week { height: var(--rowh); }
	.week.first { scroll-snap-align: start; }
	button.day { display: flex; flex-direction: column; gap: 0.05rem; align-items: stretch; min-width: 0; overflow: hidden; padding: 0.25rem 0.4rem; border: 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0; background: none; color: var(--text); text-align: left; font-size: 0.8rem; line-height: 1.25; }
	button.day:nth-child(7) { border-right: 0; }
	button.day:hover, button.day:focus-visible { background: var(--soft); }
	button.day.out { color: var(--muted); background: var(--soft); }
	button.day .num { font-size: 0.85rem; white-space: nowrap; }
	button.day b { white-space: nowrap; }
	button.day.today .num { color: var(--accent); font-weight: 700; }
	button.day b { font-size: 0.95rem; font-variant-numeric: tabular-nums; }
	button.day small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.74rem; }
	@media (max-width: 560px) {
		.cal-wrap { --rowh: 3.5rem; }
		button.day { padding: 0.2rem 0.25rem; }
		button.day small, button.day b span { display: none; }
		button.day b { font-size: 0.8rem; }
	}
	[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="head"><h1>Employees</h1><button id="syncTop" class="small" hidden title="Pull the latest hours from timesheet.io">Sync</button></div>
<div class="tiles" id="tiles"></div>
<div id="msg"></div>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script>
	"use strict";
	// Served by Ledger at /m/employees/, so API calls carry the user's login.
	const api = (path, opts = {}) =>
		fetch(`/api/v1/m/employees${path}`, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } }).then(async (r) => {
			if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || r.statusText);
			return r.status === 204 ? null : r.json();
		});
	const send = (method, path, body) => api(path, { method, body: JSON.stringify(body ?? {}) });

	// h("td", { class: "n" }, "text", node…): text always goes in as text nodes, never as HTML.
	function h(tag, props, ...kids) {
		const el = document.createElement(tag);
		for (const [k, v] of Object.entries(props || {})) {
			if (v === undefined || v === null || v === false) continue;
			if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
			else if (k === "class") el.className = v;
			else if (k === "value") el.value = v;
			else if (k === "checked" || k === "disabled" || k === "selected" || k === "hidden") el[k] = Boolean(v);
			else el.setAttribute(k, v === true ? "" : v);
		}
		el.append(...clean(kids));
		return el;
	}
	const clean = (kids) => kids.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false);
	const put = (el, ...kids) => el.replaceChildren(...clean(kids));
	const $ = (id) => document.getElementById(id);
	const st = { summary: null, employees: [], projects: [], customers: [], accounts: [], tab: "time" };
	const canEdit = () => st.summary && st.summary.role !== "viewer";
	const cur = () => st.summary?.currency ?? "";
	const money = (c) => `${(Number(c) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
	const moneyC = (c) => `${money(c)} ${cur()}`;
	const hrs = (m) => (Number(m) / 60).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
	const toCents = (v) => {
		const n = Number(String(v).replace(/[$,\s]/g, ""));
		if (String(v).trim() === "" || !Number.isFinite(n) || n < 0) throw new Error(`"${v}" isn't an amount`);
		return Math.round(n * 100);
	};
	const dollars = (c) => (c === null || c === undefined ? "" : (Number(c) / 100).toFixed(2));
	const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
	const today = () => iso(new Date());
	const monthStart = () => iso(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
	const prevMonth = () => {
		const n = new Date();
		return [iso(new Date(n.getFullYear(), n.getMonth() - 1, 1)), iso(new Date(n.getFullYear(), n.getMonth(), 0))];
	};

	function say(text, error = false) {
		$("msg").replaceChildren(text ? h("div", { class: error ? "error" : "", role: error ? "alert" : "status" }, text) : "");
		if (text && !error) setTimeout(() => $("msg").firstChild?.textContent === text && $("msg").replaceChildren(), 8000);
	}
	const fail = (e) => say(e.message || String(e), true);
	/** Runs an action from a button: disables it meanwhile and shows what went wrong. */
	const act = (fn) => async (ev) => {
		ev?.preventDefault?.();
		const btn = ev?.submitter ?? (ev?.currentTarget instanceof HTMLButtonElement ? ev.currentTarget : null);
		if (btn) btn.disabled = true;
		try {
			await fn(ev);
		} catch (e) {
			fail(e);
		} finally {
			if (btn) btn.disabled = false;
		}
	};
	const field = (label, input, hint) => h("label", {}, label, input, hint && h("small", {}, hint));
	const chip = (text, kind = "") => h("span", { class: `chip ${kind}` }, text);
	const table = (heads, rows, foot) =>
		h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, heads.map((t) => h("th", { class: t.startsWith("#") ? "n" : "" }, t.replace(/^#/, ""))))), h("tbody", {}, rows), foot && h("tfoot", {}, foot)));
	const empty = (text) => h("p", { class: "muted" }, text);

	// ---- dialogs ------------------------------------------------------------
	function dialog(title, body, submitLabel, onSubmit) {
		const dlg = $("dlg");
		const err = h("p", { style: "color: var(--danger)" });
		const form = h(
			"form",
			{
				onsubmit: async (ev) => {
					ev.preventDefault();
					const btn = ev.submitter;
					if (btn) btn.disabled = true;
					try {
						await onSubmit();
						dlg.close();
					} catch (e) {
						err.textContent = e.message || String(e);
					} finally {
						if (btn) btn.disabled = false;
					}
				},
			},
			h("h2", {}, title),
			body,
			err,
			h("div", { class: "actions" }, h("button", { type: "button", class: "plain", onclick: () => dlg.close() }, "Cancel"), submitLabel && h("button", { type: "submit" }, submitLabel)),
		);
		dlg.replaceChildren(form);
		dlg.showModal();
	}

	// "+ New account…": Ledger opens its New account dialog over this page and answers with the account.
	function newAccount(defaults = {}) {
		const id = crypto.randomUUID();
		return new Promise((resolve) => {
			addEventListener("message", function on(e) {
				if (e.origin !== location.origin || e.data?.type !== "ledger-new-account-result" || e.data.id !== id) return;
				removeEventListener("message", on);
				resolve(e.data.account);
			});
			parent.postMessage({ type: "ledger-new-account", id, defaults }, location.origin);
		});
	}

	/** Account picker: the chart as a tree, bank and card accounts first when asked, ending with "+ New account…". */
	function accountSelect({ types, selected, banksFirst = false, defaults = {} }) {
		const sel = h("select", { required: true });
		const fill = (pick) => {
			const list = st.accounts.filter((a) => types.includes(a.type) && a.currency === cur());
			const codes = new Set(list.map((a) => a.code));
			const kids = new Map();
			for (const a of list) {
				const p = a.parent_code && codes.has(a.parent_code) ? a.parent_code : "";
				kids.set(p, [...(kids.get(p) || []), a]);
			}
			const opts = [];
			(function walk(parent, depth) {
				for (const a of (kids.get(parent) || []).sort((x, y) => x.code.localeCompare(y.code, undefined, { numeric: true }))) {
					opts.push(h("option", { value: a.code }, `${"   ".repeat(depth)}${a.code} · ${a.name}`));
					walk(a.code, depth + 1);
				}
			})("", 0);
			const tagged = banksFirst ? list.filter((a) => a.kind) : [];
			put(sel, 
				h("option", { value: "" }, "Choose an account…"),
				tagged.length ? h("optgroup", { label: "Bank and card accounts" }, tagged.map((a) => h("option", { value: a.code }, `${a.code} · ${a.name}`))) : null,
				tagged.length ? h("optgroup", { label: "All accounts" }, opts) : opts,
				canEdit() ? h("option", { value: "+" }, "+ New account…") : null,
			);
			sel.value = pick && codes.has(pick) ? pick : "";
		};
		fill(selected);
		let last = sel.value;
		sel.addEventListener("change", async () => {
			if (sel.value !== "+") return void (last = sel.value);
			sel.value = last;
			const made = await newAccount({ type: types[0], currency: cur(), ...defaults });
			if (!made) return;
			st.accounts.push({ code: made.code, name: made.name, type: made.type, currency: made.currency, kind: made.kind ?? null, parent_code: made.parent_code ?? null });
			fill(made.code);
			last = sel.value;
		});
		return sel;
	}

	function customerSelect(selected) {
		const sel = h("select", {});
		const fill = (pick) => {
			put(sel, h("option", { value: "" }, "No customer"), st.customers.map((c) => h("option", { value: c.id }, c.name)), canEdit() ? h("option", { value: "+" }, "+ New customer…") : null);
			sel.value = pick === null || pick === undefined ? "" : String(pick);
		};
		fill(selected);
		let last = sel.value;
		sel.addEventListener("change", async () => {
			if (sel.value !== "+") return void (last = sel.value);
			sel.value = last;
			const name = prompt("Customer name (added to Ledger's Entities)");
			if (!name?.trim()) return;
			try {
				const c = await send("POST", "/customers", { name });
				if (!st.customers.some((x) => x.id === c.id)) st.customers.push(c);
				st.customers.sort((a, b) => a.name.localeCompare(b.name));
				fill(c.id);
				last = sel.value;
			} catch (e) {
				alert(e.message);
			}
		});
		return sel;
	}

	// ---- shared data ----------------------------------------------------------
	async function loadShared() {
		const [summary, employees, projects, customers, accounts] = await Promise.all([api("/summary"), api("/employees"), api("/projects"), api("/customers"), api("/accounts")]);
		Object.assign(st, { summary, employees: employees.data, projects: projects.data, customers: customers.data, accounts: accounts.data });
		drawTiles();
	}
	async function refreshSummary() {
		st.summary = await api("/summary");
		drawTiles();
	}
	function drawTiles() {
		const s = st.summary;
		const tile = (value, label) => h("div", { class: "tile" }, h("b", {}, value), h("span", {}, label));
		put($("tiles"), tile(String(s.employees), "active employees"), tile(`${hrs(s.unpaid_minutes)} h`, "not on a pay run yet"), tile(`${hrs(s.unbilled_minutes)} h`, "billable, not billed"), tile(moneyC(s.unbilled_cents), "to bill"));
		$("syncTop").hidden = !canEdit();
	}
	$("syncTop").onclick = (ev) => act(syncNow)(ev);
	async function syncNow() {
		say("Pulling hours from timesheet.io…");
		const r = await send("POST", "/timesheet/sync");
		await loadShared();
		await show(st.tab);
		say(r.summary);
	}

	// ---- Time -----------------------------------------------------------------
	const timeFilter = { from: monthStart(), to: "", employee_id: "", show: "" };

	function entryForm(entry) {
		const fromTimesheet = entry?.source === "timesheet";
		const f = {
			employee: h("select", { required: true, disabled: fromTimesheet }, h("option", { value: "" }, "Choose…"), st.employees.filter((e) => e.is_active || e.id === entry?.employee_id).map((e) => h("option", { value: e.id }, e.name))),
			date: h("input", { type: "date", required: true, value: entry?.work_date ?? today(), disabled: fromTimesheet }),
			hours: h("input", { class: "num", inputmode: "decimal", required: true, placeholder: "e.g. 7.5", value: entry ? (entry.minutes / 60).toFixed(2) : "", disabled: fromTimesheet }),
			project: h("select", { disabled: fromTimesheet }, h("option", { value: "" }, "No project"), st.projects.filter((p) => p.is_active || p.id === entry?.project_id).map((p) => h("option", { value: p.id }, p.customer_name ? `${p.name} · ${p.customer_name}` : p.name))),
			description: h("input", { maxlength: 2000, value: entry?.description ?? "", disabled: fromTimesheet }),
			billable: h("input", { type: "checkbox", checked: entry?.billable ?? false, disabled: fromTimesheet }),
			rate: h("input", { class: "num", inputmode: "decimal", placeholder: "project or employee rate", value: dollars(entry?.bill_rate_cents) }),
		};
		if (entry) {
			f.employee.value = String(entry.employee_id);
			f.project.value = entry.project_id === null ? "" : String(entry.project_id);
		}
		const node = h(
			"div",
			{},
			fromTimesheet && h("p", { class: "note" }, "This entry comes from timesheet.io. Change it there and sync; only its billing rate can be set here."),
			h("div", { class: "row" }, field("Employee", f.employee), field("Date", f.date), field("Hours", f.hours)),
			h("div", { class: "row" }, field("Project", f.project), field("What was done", f.description)),
			h("div", { class: "row" }, h("label", { class: "check" }, f.billable, "Billable"), field(`Billing rate per hour (${cur()})`, f.rate, "Leave empty to use the project's or the employee's rate.")),
		);
		const read = () => {
			const rate = f.rate.value.trim() === "" ? null : toCents(f.rate.value);
			if (fromTimesheet) return { bill_rate_cents: rate };
			const hours = Number(f.hours.value.replace(",", "."));
			if (!Number.isFinite(hours) || hours <= 0) throw new Error("Enter the hours worked, e.g. 7.5");
			return { employee_id: Number(f.employee.value), work_date: f.date.value, minutes: Math.round(hours * 60), project_id: f.project.value ? Number(f.project.value) : null, description: f.description.value, billable: f.billable.checked, bill_rate_cents: rate };
		};
		return { node, read };
	}

	function entryStatus(t) {
		const out = [];
		if (t.source === "timesheet") out.push(chip("timesheet.io"));
		if (t.billing_id !== null) out.push(chip("billed", "ok"));
		else if (t.billable) out.push(chip("billable", "warn"));
		if (t.pay_run_id !== null) out.push(chip("on pay run", "ok"));
		return out;
	}

	async function showTime() {
		const qs = new URLSearchParams(Object.entries(timeFilter).filter(([, v]) => v));
		const { data } = await api(`/time?${qs}`);
		const reload = () => Promise.all([showTime(), refreshSummary()]);
		const sel = h("select", { onchange: (e) => ((timeFilter.employee_id = e.target.value), showTime().catch(fail)) }, h("option", { value: "" }, "Everyone"), st.employees.map((e) => h("option", { value: e.id }, e.name)));
		sel.value = timeFilter.employee_id;
		const show = h("select", { onchange: (e) => ((timeFilter.show = e.target.value), showTime().catch(fail)) }, h("option", { value: "" }, "All time"), h("option", { value: "billable" }, "Billable, not billed"), h("option", { value: "unpaid" }, "Not on a pay run"));
		show.value = timeFilter.show;
		const total = data.reduce((a, t) => a + t.minutes, 0);
		put($("main"), 
			h(
				"div",
				{ class: "row" },
				field("From", h("input", { type: "date", value: timeFilter.from, onchange: (e) => ((timeFilter.from = e.target.value), showTime().catch(fail)) })),
				field("To", h("input", { type: "date", value: timeFilter.to, onchange: (e) => ((timeFilter.to = e.target.value), showTime().catch(fail)) })),
				field("Employee", sel),
				field("Show", show),
				canEdit() &&
					h(
						"button",
						{
							onclick: () => {
								if (!st.employees.some((e) => e.is_active)) return say("Add an employee first, on the People tab.", true);
								const f = entryForm(null);
								dialog("Add time", f.node, "Add", async () => {
									await send("POST", "/time", f.read());
									await reload();
								});
							},
						},
						"Add time",
					),
			),
			data.length === 0
				? empty(st.summary.timesheet.configured ? "No time in this period. Add some, or sync timesheet.io." : "No time in this period. Add some here, or connect timesheet.io under Settings → Employees to pull it in.")
				: table(
						["Date", "Employee", "Project", "What", "#Hours", "#Rate", "#Amount", "", ""],
						data.map((t) => {
							const locked = t.billing_id !== null || t.pay_run_id !== null;
							return h(
								"tr",
								{},

	function downloadCsv(name, rows) {
		const esc = (v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v));
		const url = URL.createObjectURL(new Blob([rows.map((r) => r.map(esc).join(",")).join("\r\n")], { type: "text/csv" }));
		h("a", { href: url, download: name }).click();
		setTimeout(() => URL.revokeObjectURL(url), 5000);
	}

			draft

						class: "num",

								await send("PATCH", `/pay-runs/${id}/lines/${line.id}`, { [key]: toCents(ev.target.value) });

								await showRun(id);

			table(

				run.lines.map((l) => h("tr", {}, h("td", {}, l.employee_name, " ", l.pay_type === "salary" && chip("salary")), h("td", { class: "n" }, l.pay_type === "salary" ? "" : hrs(l.minutes)), h("td", { class: "n" }, money(l.rate_cents)), h("td", { class: "n" }, amount(l, "gross_cents")), h("td", { class: "n" }, amount(l, "deductions_cents")), h("td", { class: "n" }, money(l.net_cents)), h("td", { class: "n" }, amount(l, "employer_cost_cents")))),
				h("tr", {}, h("td", { colspan: 3 }, "Total"), h("td", { class: "n" }, money(run.gross_cents)), h("td", { class: "n" }, money(run.deductions_cents)), h("td", { class: "n" }, money(run.net_cents)), h("td", { class: "n" }, money(run.employer_cost_cents))),
			),

				"div",
				{ class: "actions" },
				draft && h("button", { class: "danger", onclick: act(async () => confirm("Delete this draft? Its hours go back to unpaid.") && (await api(`/pay-runs/${id}`, { method: "DELETE" }), await back())) }, "Delete draft"),
				draft &&
					h(
						"button",
						{
							onclick: () => {
								const a = st.summary.accounts;
								const paid = accountSelect({ types: ["asset", "liability"], banksFirst: true, defaults: { name: "Chequing", type: "asset" } });
								const wages = accountSelect({ types: ["expense"], selected: a.wages_expense_account, defaults: { name: "Wages and salaries" } });

								const emp = accountSelect({ types: ["expense"], selected: a.employer_cost_account, defaults: { name: "Employer payroll costs" } });
								const needLiab = Number(run.deductions_cents) + Number(run.employer_cost_cents) > 0;
								const needEmp = Number(run.employer_cost_cents) > 0;
								dialog(
									`Post pay run ${run.id}`,
									h(

										h("p", { class: "muted" }, "Posts one journal entry. Posted entries can't be edited, only reversed."),
										h("div", { class: "row" }, field("Net pay is paid from", paid, "Your bank account, or a wages payable account if you pay later.")),

								h("td", {}, e.pay_type),
								h("td", { class: "n" }, Number(e.pay_rate_cents) > 0 ? `${money(e.pay_rate_cents)}${e.pay_type === "hourly" ? " /h" : " /run"}` : chip("set a rate", "warn")),
								h("td", { class: "n" }, `${money(e.bill_rate_cents)} /h`),
								h("td", { class: "n" }, `${e.withholding_percent}%`),
								h("td", { class: "n" }, `${e.employer_cost_percent}%`),
								h("td", {}, !e.is_active && chip("inactive"), e.timesheet_user_id && chip("timesheet.io")),
								h("td", {}, edit(employeeDialog, e)),
							),
						),
					),
			h("div", { class: "top", style: "margin-top: 1.5rem" }, h("h2", { style: "margin: 0" }, "Projects"), canEdit() && h("button", { class: "plain", onclick: () => projectDialog(null) }, "Add project")),
			h("p", { class: "muted" }, "A project says which customer its billable hours are billed to. Customers are Ledger's shared Entities."),
			st.projects.length === 0
				? empty("No projects yet.")
				: table(
						["Project", "Customer", "#Billing rate", "", ""],
						st.projects.map((p) => h("tr", {}, h("td", {}, p.name), h("td", {}, p.customer_name ?? chip("choose a customer", "warn"), !p.customer_name && p.timesheet_client_name ? h("div", {}, h("small", {}, `timesheet.io client: ${p.timesheet_client_name}`)) : null), h("td", { class: "n" }, p.bill_rate_cents === null ? h("span", { class: "muted" }, "employee's") : `${money(p.bill_rate_cents)} /h`), h("td", {}, !p.is_active && chip("inactive"), p.timesheet_project_id && chip("timesheet.io")), h("td", {}, edit(projectDialog, p)))),
					),
		);
	}

	// ---- Calendar: one month in view; scroll up or down for other months ---------------
	const cal = { employee_id: "", days: new Map(), start: null, end: null, busy: false };
	const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
	const monthName = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });
	const shortMonth = new Intl.DateTimeFormat(undefined, { month: "short" });

	async function calLoad(from, to) {
		const { data } = await api(`/calendar?from=${iso(from)}&to=${iso(to)}${cal.employee_id ? `&employee_id=${cal.employee_id}` : ""}`);
		for (const r of data) {
			if (!cal.days.has(r.work_date)) cal.days.set(r.work_date, []);
			cal.days.get(r.work_date).push(r);
		}
	}

	/** The week rows from a Sunday to a Saturday. */
	function calWeeks(from, to) {
		const rows = [];
		const now = today();
		for (let d = from; d <= to; d = addDays(d, 7)) {
			const cells = [];
			let first = false;
			for (let i = 0; i < 7; i++) {
				const day = addDays(d, i);
				const key = iso(day);
				const list = cal.days.get(key) || [];
				const total = list.reduce((a, r) => a + r.minutes, 0);
				const billable = list.reduce((a, r) => a + r.billable_minutes, 0);
				if (day.getDate() === 1) first = true;
				cells.push(
					h(
						"button",
						{
							class: `day${key === now ? " today" : ""}`,
							"data-month": key.slice(0, 7),
							title: total ? `${key}: ${hrs(total)} h${billable ? `, ${hrs(billable)} h billable` : ""}. Open this day on the Time tab.` : `${key}: open this day on the Time tab.`,
							onclick: () => {
								Object.assign(timeFilter, { from: key, to: key, employee_id: cal.employee_id, show: "" });
								show("time").catch(fail);
							},
						},
						h("span", { class: "num" }, day.getDate() === 1 ? `${shortMonth.format(day)} 1` : String(day.getDate())),
						total > 0 && h("b", {}, hrs(total), h("span", {}, " h")),
						list.length > 1 || (list.length === 1 && !cal.employee_id) ? list.slice(0, 2).map((r) => h("small", {}, `${r.employee_name} ${hrs(r.minutes)}`)) : null,
						list.length > 2 && h("small", {}, `+${list.length - 2} more`),
					),
				);
			}
			rows.push(h("div", { class: `week${first ? " first" : ""}`, "data-last": iso(addDays(d, 6)).slice(0, 7) }, cells));
		}
		return rows;
	}

	async function showCalendar(focus = new Date()) {
		const sunday = (d) => addDays(d, -d.getDay());
		cal.days = new Map();
		cal.start = sunday(new Date(focus.getFullYear(), focus.getMonth() - 6, 1));
		cal.end = addDays(sunday(new Date(focus.getFullYear(), focus.getMonth() + 3, 0)), 6);
		cal.busy = false;
		await calLoad(cal.start, cal.end);

		const title = h("h2", { "aria-live": "polite" });
		const who = h("select", { onchange: (e) => ((cal.employee_id = e.target.value), showCalendar(shownMonth()).catch(fail)) }, h("option", { value: "" }, "Everyone"), st.employees.map((e) => h("option", { value: e.id }, e.name)));
		who.value = cal.employee_id;
		const box = h("div", { class: "cal", tabindex: "0", "aria-label": "Calendar. Scroll up or down to change the month." }, calWeeks(cal.start, cal.end));
		let month = "";
		const shownMonth = () => new Date(Number(month.slice(0, 4)), Number(month.slice(5)) - 1, 1);
		// The month in view is the one the top visible week ends in.
		const mark = () => {
			const top = box.scrollTop + 4;
			const row = [...box.children].find((w) => w.offsetTop + w.offsetHeight > top) || box.lastElementChild;
			if (!row || row.dataset.last === month) return;
			month = row.dataset.last;
			title.textContent = monthName.format(shownMonth());
			for (const c of box.querySelectorAll("button.day")) c.classList.toggle("out", c.dataset.month !== month);
		};
		const goTo = (d) => {
			const key = `${iso(d).slice(0, 7)}`;
			const row = [...box.children].find((w) => w.classList.contains("first") && w.dataset.last === key);
			if (row) box.scrollTop = row.offsetTop;
			mark();
		};
		// More months are added as the scrolling nears either end.
		const grow = async () => {
			if (cal.busy) return;
			const up = box.scrollTop < 2 * box.clientHeight;
			const down = box.scrollHeight - box.scrollTop - box.clientHeight < 2 * box.clientHeight;
			if (!up && !down) return;
			cal.busy = true;
			try {
				if (up) {
					const from = sunday(new Date(cal.start.getFullYear(), cal.start.getMonth() - 6, 1));
					const to = addDays(cal.start, -1);
					await calLoad(from, to);
					const before = box.scrollHeight;
					const at = box.scrollTop;
					box.prepend(...calWeeks(from, to));
					box.scrollTop = at + (box.scrollHeight - before);
					cal.start = from;
				} else {
					const from = addDays(cal.end, 1);
					const to = addDays(sunday(new Date(from.getFullYear(), from.getMonth() + 6, 0)), 6);
					await calLoad(from, to);
					box.append(...calWeeks(from, to));
					cal.end = to;
				}
				const keep = month;
				month = "";
				mark();
				if (!month) month = keep;
			} finally {
				cal.busy = false;
			}
		};
		let queued = false;
		box.addEventListener("scroll", () => {
			if (queued) return;
			queued = true;
			requestAnimationFrame(() => {
				queued = false;
				mark();
				grow().catch(fail);
			});
		});
		const base = new Date(2023, 0, 1); // a Sunday
		const dow = new Intl.DateTimeFormat(undefined, { weekday: "short" });
		put(
			$("main"),
			h("div", { class: "cal-head" }, title, h("div", { class: "row" }, field("Employee", who), h("button", { class: "plain", onclick: () => goTo(new Date()) }, "Today"))),
			h("div", { class: "cal-wrap" }, h("div", { class: "dow" }, [0, 1, 2, 3, 4, 5, 6].map((i) => h("span", {}, dow.format(addDays(base, i))))), box),
			h("p", { class: "muted" }, "Hours worked each day. Scroll up or down in the calendar to move through the months; click a day to see its time entries."),
		);
		goTo(focus);
	}

	// ---- tabs -----------------------------------------------------------------------
	const TABS = [
		["time", "Time", showTime],
		["calendar", "Calendar", () => showCalendar()],
		["billing", "Billable hours", showBilling],
		["payroll", "Payroll", showPayroll],
		["people", "People", showPeople],
	];
	async function show(tab) {
		st.tab = tab;
		$("tabs").replaceChildren(...TABS.map(([id, label]) => h("button", { role: "tab", "aria-selected": String(id === tab), onclick: () => show(id).catch(fail) }, label)));
		await TABS.find(([id]) => id === tab)[2]();
	}

	(async () => {
		await loadShared();
		const p = new URLSearchParams(location.search);
		if (p.get("payrun") && /^\d+$/.test(p.get("payrun"))) {
			openRun = Number(p.get("payrun"));
			await show("payroll");
		} else if (p.get("billing") && /^\d+$/.test(p.get("billing"))) {
			await show("billing");
			await openBilling(p.get("billing"));
		} else if (p.get("employee")) {
			await show("people");
			const e = st.employees.find((x) => String(x.id) === p.get("employee"));
			if (e && canEdit()) employeeDialog(e);
		} else await show(TABS.some(([id]) => id === p.get("tab")) ? p.get("tab") : "time");
	})().catch(fail);
</script>
</body>
